name: technical-checks
on: [push, pull_request]
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: poisonlab smoke --run-dir runs/smoke
